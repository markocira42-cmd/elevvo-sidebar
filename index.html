<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Mark Ocira">
    <meta name="description" content="sidebar, elevvo pathways internship">
    <title>Elevvo Sidebar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="assets/icons/font-awesome/all.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <button id="sidebar-toggle-open" class="sidebar-button">
            <i class="fas fa-bars"></i>
        </button>
        <h1 class="logo"><span class="highlight">My</span> App</h1>
    </header>


    <nav id="sidebar">

        <section class="sidebar-header">
            <h1 class="logo"><span class="highlight">My</span> App</h1>

            <button id="sidebar-toggle-close" class="sidebar-button">
                <i class="fas fa-xmark icon"></i>
            </button>
        </section>
        <section class="sidebar-links">
            <ul>
                <li>
                    <a href="#" target="_self">
                        <i class="fas fa-home icon"></i> Home
                    </a>
                </li>
                <li>
                    <a href="#" target="_self">
                        <i class="fas fa-user icon"></i> Profile
                    </a>
                </li>
                <li>
                    <a href="#" target="_self">
                        <i class="fas fa-gear icon"></i> Settings
                    </a>
                </li>
                <li>
                    <a href="#" target="_self">
                        <i class="fas fa-envelope icon"></i> Messages
                    </a>
                </li>
            </ul>
        </section>

    </nav>

    <main>
        <h1>Welcome to the Dashboard</h1>
    </main>

</body>
</html>
